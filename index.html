<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microwave Repair Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-slider">
    <div class="slider-track" id="sliderTrack"></div>
  </div>
  <div class="overlay"></div>
  <div class="content">
    <header>
      <h1>Microwave Repair Shop</h1>
      <p>Fast • Reliable • Affordable Services</p>
    </header>
    <div class="info-card">
      <h2><i class="fas fa-address-book"></i> Contact Information</h2>
      <div id="contactInfo">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading contact information...</p>
        </div>
      </div>
    </div>
    <div class="info-card">
      <h2><i class="fas fa-user-tie"></i> Meet The Owner</h2>
      <div class="owner-section" id="ownerInfo">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Loading owner information...</p>
        </div>
      </div>
    </div>
    
    <!-- New Gallery Section -->
    <div class="gallery-section">
      <h2><i class="fas fa-images"></i>Gallery</h2>
      <div class="gallery-container">
        <div class="gallery-slider" id="gallerySlider"></div>
        <div class="gallery-controls">
          <button class="gallery-btn" id="prevBtn" aria-label="Previous image">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button class="gallery-btn" id="nextBtn" aria-label="Next image">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="gallery-indicators" id="galleryIndicators"></div>
    </div>
    
    <div class="slider-dots" id="sliderDots"></div>
  </div>
<script>
async function loadShopData() {
  try {
    const response = await fetch('shop-data.json');
    const data = await response.json();
    document.getElementById('contactInfo').innerHTML = `
      <div class="contact-item">
        <i class="fas fa-phone"></i>
        <a href="tel:${data.phone}">${data.phone}</a>
      </div>
      <div class="contact-item">
        <i class="fas fa-map-marker-alt"></i>
        <span>${data.address}</span>
      </div>
      <div class="contact-item">
        <i class="fas fa-envelope"></i>
        <a href="mailto:${data.email}">${data.email}</a>
      </div>
      <div class="btn-container">
        <a class="btn" href="${data.mapLink}" target="_blank">
          <i class="fas fa-map-marker-alt"></i> Find Us
        </a>
        <a class="btn" href="whatsapp://send?text=Contact ${data.shopName} at ${data.phone}">
          <i class="fab fa-whatsapp"></i> Share
        </a>
      </div>
    `;
    document.getElementById('ownerInfo').innerHTML = `
      <img src="${data.ownerImage}" class="owner-img" alt="Owner">
      <p>${data.ownerName}</p>
    `;
    document.querySelector('header h1').textContent = data.shopName;
    document.title = data.shopName;
  } catch (e) {
    console.error('Error loading shop data:', e);
    document.getElementById('contactInfo').innerHTML = '<p>Error loading contact information</p>';
    document.getElementById('ownerInfo').innerHTML = '<p>Error loading owner information</p>';
  }
}

const images = [
  "images/img1.jpeg",
  "images/img2.jpg",
  "images/5.jpeg",
  "images/8.jpeg",
  "images/7.jpeg",
  "images/9.jpeg"
];

const sliderTrack = document.getElementById("sliderTrack");
const sliderDots = document.getElementById("sliderDots");
const gallerySlider = document.getElementById("gallerySlider");
const galleryIndicators = document.getElementById("galleryIndicators");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentBgIndex = 0;
let currentGalleryIndex = 0;
let autoBgSlide;
let autoGallerySlide;
let isTransitioning = false;

// Initialize background slider and gallery
images.forEach((src, i) => {
  // Background slider
  sliderTrack.innerHTML += `<div class="slide"><img src="${src}" alt="Background ${i + 1}"></div>`;
  sliderDots.innerHTML += `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToBgSlide(${i})"></div>`;
  
  // Gallery slider
  gallerySlider.innerHTML += `<div class="gallery-slide"><img src="${src}" alt="Gallery image ${i + 1}"></div>`;
  galleryIndicators.innerHTML += `<div class="gallery-dot ${i === 0 ? 'active' : ''}" onclick="goToGallerySlide(${i})"></div>`;
});

// Background slider functions
function updateBgSlider() {
  const offset = currentBgIndex * window.innerWidth;
  sliderTrack.style.transform = `translateX(-${offset}px)`;
  document.querySelectorAll('#sliderDots .dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentBgIndex)
  );
}

function goToBgSlide(i) {
  currentBgIndex = i;
  updateBgSlider();
  resetAutoBgSlide();
}

function nextBgSlide() {
  currentBgIndex = (currentBgIndex + 1) % images.length;
  updateBgSlider();
}

function resetAutoBgSlide() {
  clearInterval(autoBgSlide);
  autoBgSlide = setInterval(nextBgSlide, 3000);
}

// Gallery slider functions
function updateGallerySlider() {
  if (isTransitioning) return;
  isTransitioning = true;
  
  gallerySlider.style.transform = `translateX(-${currentGalleryIndex * 100}%)`;
  document.querySelectorAll('.gallery-dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentGalleryIndex)
  );
  
  setTimeout(() => {
    isTransitioning = false;
  }, 600);
}

function goToGallerySlide(i) {
  if (isTransitioning) return;
  currentGalleryIndex = i;
  updateGallerySlider();
  resetAutoGallerySlide();
}

function nextGallerySlide() {
  if (isTransitioning) return;
  currentGalleryIndex = (currentGalleryIndex + 1) % images.length;
  updateGallerySlider();
}

function prevGallerySlide() {
  if (isTransitioning) return;
  currentGalleryIndex = (currentGalleryIndex - 1 + images.length) % images.length;
  updateGallerySlider();
}

function resetAutoGallerySlide() {
  clearInterval(autoGallerySlide);
  autoGallerySlide = setInterval(nextGallerySlide, 4000);
}

// Gallery button event listeners
prevBtn.addEventListener('click', () => {
  prevGallerySlide();
  resetAutoGallerySlide();
});

nextBtn.addEventListener('click', () => {
  nextGallerySlide();
  resetAutoGallerySlide();
});

// Touch swipe support for gallery
let touchStartX = 0;
let touchEndX = 0;

gallerySlider.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

gallerySlider.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const swipeThreshold = 50;
  const diff = touchStartX - touchEndX;
  
  if (Math.abs(diff) > swipeThreshold) {
    if (diff > 0) {
      nextGallerySlide();
    } else {
      prevGallerySlide();
    }
    resetAutoGallerySlide();
  }
}

// Responsive handling
window.addEventListener('resize', () => {
  updateBgSlider();
  updateGallerySlider();
});

// Initialize
loadShopData();
resetAutoBgSlide();
resetAutoGallerySlide();
</script>
</body>
</html>
